[build-system]
requires = ["setuptools>=75", "wheel", "pybind11>=2.13,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "thoth-mira"
version = "2.0.0"
description = "A Mira variable star observatory with native C++ analysis and Python visualization"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jesse Sullivan"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]
cluster = ["mpi4py>=4,<5"]

[project.scripts]
thoth = "thoth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thoth = ["web/*", "data/*", "data/lightcurves/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
